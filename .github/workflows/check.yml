name: Core contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tests/test_workspace.py
      - run: python3 tests/test_session_graph.py
      - run: python3 tests/test_manual.py
      - run: python3 tests/test_seamless_protocol.py
      - run: python3 tests/test_pairing_invites.py
      - run: python3 portable/test_catalog.py --java
